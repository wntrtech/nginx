server {
    listen      8080;
    listen [::]:8080;
    server_name localhost;
    server_tokens off;
    http2 on;

    include /etc/nginx/snippets/healthz.conf;

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
    }

    error_page 500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
