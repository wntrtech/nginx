# Silent /healthz for HEALTHCHECK / k8s probes. Include inside a server block.
# Restricted to loopback and RFC1918 / IPv6 ULA so probes from inside the
# container, the Docker network, or a k8s cluster work — but the endpoint
# is never reachable from the public internet.
location = /healthz {
    access_log off;

    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow fc00::/7;
    deny  all;

    # `return` runs at the rewrite phase, before allow/deny is evaluated at
    # the access phase. Route through try_files (content phase, runs after
    # access) so the deny rules actually apply.
    try_files /__healthz_internal_path_does_not_exist @__healthz_body;
}

location @__healthz_body {
    internal;
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
}
